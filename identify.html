<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Confirm property — Parcela</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/onboarding.css" />
</head>
<body>
  <header class="onboard-topbar">
    <a href="index.html" class="brand">
      <span class="onboard-brand-mark" aria-hidden="true"></span>
      Parcela
    </a>
    <span id="lang-toggle-slot"></span>
  </header>

  <main class="onboard-main">
    <div class="onboard-stage" style="max-width: 860px;">
      <div class="onboard-step" data-i18n="identify_step">Step 2 of 3</div>
      <h1 id="prop-address">123 Example Avenue</h1>
      <p class="onboard-sub" id="prop-locality">San Juan, Puerto Rico</p>

      <div class="identify-grid">
        <div class="identify-map">
          <div class="map-svg-slot" id="identify-map-slot"></div>
        </div>
        <div>
          <ul class="identify-meta-list">
            <li><span class="k" data-i18n="common_cadastralNumber">Cadastral number</span><span class="v" id="prop-cadastral"></span></li>
            <li><span class="k" data-i18n="common_parcelArea">Parcel area</span><span class="v" id="prop-area"></span></li>
            <li><span class="k" data-i18n="common_municipality">Municipality</span><span class="v" id="prop-municipality"></span></li>
          </ul>
          <div class="onboard-actions" style="margin-top:var(--sp-5);">
            <a href="setup.html" id="identify-cta" class="btn btn-primary" data-i18n="identify_cta">Analyze this property</a>
            <a href="search.html" class="btn btn-ghost" data-i18n="identify_change">Change property</a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/data/mockData.js"></script>
  <script src="js/data/lookup.js"></script>
  <script src="js/data/live.js"></script>
  <script src="js/ui/map.js"></script>
  <script>
    (async function () {
      const I = window.ParcelaI18N;
      const P = window.PARCELA;
      const cadastral = window.ParcelaLive.parcelParam();
      if (cadastral) {
        document.getElementById("prop-address").textContent = I.t("live_loading");
        document.getElementById("prop-locality").textContent = "";
        try {
          window.ParcelaLive.apply(P, await window.ParcelaLive.lookup(cadastral));
        } catch (err) {
          document.getElementById("prop-address").textContent = I.t("live_loadError");
          document.getElementById("identify-cta").href = "search.html";
          document.getElementById("identify-cta").textContent = I.t("live_retry");
          return;
        }
        document.getElementById("identify-cta").href = `setup.html?parcel=${encodeURIComponent(cadastral)}`;
      }

      const p = P.property;
      document.getElementById("prop-address").textContent = p.address;
      document.getElementById("prop-locality").textContent = p.municipality;
      document.getElementById("prop-cadastral").textContent = p.cadastral;
      document.getElementById("prop-area").textContent = p.parcelAreaCuerdas != null
        ? `${p.parcelAreaSqm.toLocaleString()} m² (${p.parcelAreaCuerdas} cuerdas)`
        : `${p.parcelAreaSqm.toLocaleString()} m² (${p.parcelAreaAcres} ac)`;
      document.getElementById("prop-municipality").textContent = P.live ? P.liveData.property.municipality : p.municipality.split(",")[0];

      const ns = "http://www.w3.org/2000/svg";
      const shape = window.ParcelaMap.shape;
      const map = P.map;
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", map.viewBox);
      const bg = document.createElementNS(ns, "rect");
      bg.setAttribute("width", "640"); bg.setAttribute("height", "520"); bg.setAttribute("fill", "var(--map-base-land)");
      svg.appendChild(bg);
      map.context.forEach((c, i) => {
        svg.appendChild(shape(c, map.live
          ? { fill: "var(--map-parcel)", stroke: "var(--map-base-block)", "stroke-width": "1", opacity: "0.7" }
          : { fill: i % 2 === 0 ? "var(--map-base-block)" : "var(--map-parcel)", opacity: "0.55" }));
      });
      (map.streets || []).forEach((st) => svg.appendChild(shape(st, { fill: "var(--map-road)", opacity: "0.9" })));
      map.roads.forEach((r) => {
        const pts = r.points.split(" ").map((pt) => pt.split(",").map(Number));
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", pts[0][0]); line.setAttribute("y1", pts[0][1]);
        line.setAttribute("x2", pts[1][0]); line.setAttribute("y2", pts[1][1]);
        line.setAttribute("stroke", "var(--map-road)"); line.setAttribute("stroke-width", r.width);
        svg.appendChild(line);
      });
      svg.appendChild(shape(map.parcel, { fill: "rgba(20,22,26,0.08)", stroke: "var(--map-selected)", "stroke-width": "2.4" }));
      document.getElementById("identify-map-slot").appendChild(svg);
    })();
  </script>
</body>
</html>
