<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Feasibility report — Parcela</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/report.css" />
</head>
<body>
  <div class="shell">
    <aside class="shell-nav">
      <a href="landing.html" class="shell-brand">
        <span class="shell-brand-mark" aria-hidden="true"></span>
        Parcela
      </a>
      <ul class="shell-nav-list">
        <li><a href="overview.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="nav_overview">Overview</span><span class="nav-dot"></span></a></li>
        <li><a href="explore.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 6l5-2 4 2 5-2v10l-5 2-4-2-5 2V6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span data-i18n="nav_explore">Explore</span><span class="nav-dot"></span></a></li>
        <li><a href="properties.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><path d="M10 2l7 4v8l-7 4-7-4V6l7-4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span data-i18n="nav_properties">Properties</span><span class="nav-dot"></span></a></li>
        <li><a href="projects.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 8h14" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="nav_projects">Projects</span><span class="nav-dot"></span></a></li>
        <li><a href="reports.html" class="active"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><path d="M5 2h7l3 3v13H5V2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 10h4M8 13h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span data-i18n="nav_reports">Reports</span><span class="nav-dot"></span></a></li>
      </ul>
      <div class="shell-nav-footer"><span data-i18n="nav_footer">Prototype data · Puerto Rico</span><span id="lang-toggle-slot"></span></div>
    </aside>

    <div class="shell-main">
      <div class="shell-content">
        <div class="page-head">
          <div>
            <h1 data-i18n="reports_title">Feasibility report</h1>
            <p id="report-sub"></p>
          </div>
          <div class="report-toolbar">
            <button class="btn btn-ghost" id="share-btn" data-i18n="reports_share">Share</button>
            <button class="btn btn-primary" id="download-btn" data-i18n="reports_download">Download PDF</button>
          </div>
        </div>

        <div class="report-doc" id="report-doc"></div>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/data/mockData.js"></script>
  <script>
    (function () {
      const P = window.PARCELA;
      const I = window.ParcelaI18N;
      document.getElementById("report-sub").textContent = `${P.property.address} · ${I.tv(P.project.type)} · ${I.tv(P.project.unitsLabel)}`;

      const constraintFindings = P.findings.filter((f) => f.category === "constraint");

      const regRows = [
        [I.t("common_landUse"), P.regulatory.landUse.value],
        [I.t("property_proposedUse"), P.regulatory.proposedUse.value],
        [I.t("property_applicableRegulation"), P.regulatory.applicableRegulation.value],
        [I.t("property_density"), P.regulatory.density.value],
        [I.t("property_height"), P.regulatory.height.value],
        [I.t("property_parking"), P.regulatory.parking.value],
      ];

      const physicalRows = [
        [I.t("common_flood"), P.physical.flood],
        [I.t("property_topography"), P.physical.topography],
        [I.t("property_environmental"), P.physical.environmental],
        [I.t("property_soilGeology"), P.physical.soil],
      ];

      const infraRows = [
        [I.t("property_roads"), P.infrastructure.roads],
        [I.t("property_water"), P.infrastructure.water],
        [I.t("property_electricity"), P.infrastructure.electricity],
      ];

      document.getElementById("report-doc").innerHTML = `
        <div class="rd-eyebrow eyebrow">${I.t("reports_docEyebrow")}</div>
        <h1 class="rd-title">${P.property.address}</h1>
        <p class="rd-sub">${P.property.municipality} · ${I.tv(P.project.type)} · ${I.tv(P.project.unitsLabel)} · ${P.project.investmentLabel}</p>
        <p class="rd-meta">${I.t("reports_cadastralGenerated").replace("{cad}", P.property.cadastral).replace("{date}", P.property.lastAnalyzed)}</p>

        <div class="report-section">
          <div class="rs-num">01</div>
          <h2>${I.t("reports_s01")}</h2>
          <p><strong>${I.tv(P.feasibility.status)}.</strong> ${I.tv(P.feasibility.summary)}</p>
        </div>

        <div class="report-section">
          <div class="rs-num">02</div>
          <h2>${I.t("reports_s02")}</h2>
          <ul class="rd-field-list">
            <li><span class="k">${I.t("reports_address")}</span><span class="v">${P.property.address}</span></li>
            <li><span class="k">${I.t("common_municipality")}</span><span class="v">${P.property.municipality}</span></li>
            <li><span class="k">${I.t("common_cadastralNumber")}</span><span class="v">${P.property.cadastral}</span></li>
            <li><span class="k">${I.t("common_parcelArea")}</span><span class="v">${P.property.parcelAreaSqm.toLocaleString()} m² (${P.property.parcelAreaAcres} ac)</span></li>
          </ul>
        </div>

        <div class="report-section">
          <div class="rs-num">03</div>
          <h2>${I.t("reports_s03")}</h2>
          <ul class="rd-field-list">
            <li><span class="k">${I.t("reports_projectType")}</span><span class="v">${I.tv(P.project.type)}</span></li>
            <li><span class="k">${I.t("setup_targetUnits")}</span><span class="v">${I.tv(P.project.unitsLabel)}</span></li>
            <li><span class="k">${I.t("setup_approxInvestment")}</span><span class="v">${P.project.investmentLabel}</span></li>
          </ul>
        </div>

        <div class="report-section">
          <div class="rs-num">04</div>
          <h2>${I.t("reports_s04")}</h2>
          <ul class="rd-field-list">
            ${regRows.map(([k, v]) => `<li><span class="k">${k}</span><span class="v">${I.tv(v)}</span></li>`).join("")}
          </ul>
        </div>

        <div class="report-section">
          <div class="rs-num">05</div>
          <h2>${I.t("reports_s05")}</h2>
          ${physicalRows
            .map(
              ([title, d]) => `
            <div class="rd-item">
              <h4>${title}</h4>
              <div class="rd-tag">${I.t("common_known")}</div>
              <p class="rd-sm">${I.tv(d.known)}</p>
              <div class="rd-tag">${I.t("common_needsVerification")}</div>
              <p class="rd-sm" style="margin-bottom:0;">${I.tv(d.needsVerification)}</p>
            </div>`
            )
            .join("")}
        </div>

        <div class="report-section">
          <div class="rs-num">06</div>
          <h2>${I.t("reports_s06")}</h2>
          ${infraRows
            .map(
              ([title, d]) => `
            <div class="rd-item">
              <h4>${title}</h4>
              <p class="rd-sm">${I.tv(d.available)}</p>
              <div class="rd-tag">${I.t("common_unknown")}</div>
              <p class="rd-sm">${I.tv(d.unknown)}</p>
              <div class="rd-tag">${I.t("common_nextAction")}</div>
              <p class="rd-sm" style="margin-bottom:0;">${I.tv(d.nextAction)}</p>
            </div>`
            )
            .join("")}
        </div>

        <div class="report-section">
          <div class="rs-num">07</div>
          <h2>${I.t("reports_s07")}</h2>
          ${P.developmentHistory
            .map(
              (h) => `
            <div class="rd-item">
              <h4>${h.year} — ${I.tv(h.eventType)}</h4>
              <p class="rd-sm" style="margin-bottom:0;">${I.tv(h.description)}</p>
            </div>`
            )
            .join("")}
        </div>

        <div class="report-section">
          <div class="rs-num">08</div>
          <h2>${I.t("reports_s08")}</h2>
          ${constraintFindings
            .map(
              (f) => `
            <div class="rd-item">
              <h4>${I.tv(f.title)}</h4>
              <p class="rd-sm" style="margin-bottom:0;">${I.tv(f.summary)}</p>
            </div>`
            )
            .join("")}
        </div>

        <div class="report-section">
          <div class="rs-num">09</div>
          <h2>${I.t("reports_s09")}</h2>
          ${P.unknowns
            .map(
              (u) => `
            <div class="rd-item">
              <h4>${I.tv(u.title)}</h4>
              <div class="rd-tag">${I.t("common_whyItMatters")}</div>
              <p class="rd-sm">${I.tv(u.whyItMatters)}</p>
              <div class="rd-tag">${I.t("common_nextStep")}</div>
              <p class="rd-sm" style="margin-bottom:0;">${I.tv(u.nextStep)}</p>
            </div>`
            )
            .join("")}
        </div>

        <div class="report-section">
          <div class="rs-num">10</div>
          <h2>${I.t("reports_s10")}</h2>
          ${P.nextActions
            .map(
              (a) => `
            <div class="rd-item">
              <h4>${a.order}. ${I.tv(a.title)}</h4>
              <p class="rd-sm">${I.tv(a.whyItMatters)}</p>
              <div class="rd-tag">${I.t("common_suggestedProfessional")}</div>
              <p class="rd-sm" style="margin-bottom:0;">${I.t("professional_" + a.professional)}</p>
            </div>`
            )
            .join("")}
        </div>

        <div class="report-section">
          <div class="rs-num">11</div>
          <h2>${I.t("reports_s11")}</h2>
          <table class="rd-sources-table">
            <thead><tr><th>${I.t("panel_source")}</th><th>${I.t("panel_agency")}</th><th>${I.t("panel_document")}</th><th>${I.t("panel_date")}</th></tr></thead>
            <tbody>
              ${P.sources.map((s) => `<tr><td>${s.name}</td><td>${s.agency}</td><td>${s.document}</td><td>${s.date}</td></tr>`).join("")}
            </tbody>
          </table>
          <p style="margin-top:12px; margin-bottom:0;"><a href="sources.html" class="btn-text text-sm">${I.t("reports_viewLibrary")}</a></p>
        </div>

        <p class="report-disclaimer">${I.t("reports_disclaimer")}</p>
      `;

      const downloadBtn = document.getElementById("download-btn");
      downloadBtn.addEventListener("click", () => {
        downloadBtn.disabled = true;
        downloadBtn.textContent = I.t("reports_preparing");
        setTimeout(() => {
          downloadBtn.textContent = I.t("reports_downloaded");
          setTimeout(() => {
            downloadBtn.textContent = I.t("reports_download");
            downloadBtn.disabled = false;
          }, 1600);
        }, 900);
      });

      const shareBtn = document.getElementById("share-btn");
      shareBtn.addEventListener("click", () => {
        const original = shareBtn.textContent;
        shareBtn.textContent = I.t("reports_linkCopied");
        setTimeout(() => (shareBtn.textContent = original), 1600);
      });
    })();
  </script>
</body>
</html>
