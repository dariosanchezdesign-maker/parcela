<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sources & evidence — ATERRA</title>
  <meta name="theme-color" content="#000000" />
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/brand/app-icon.png" />
  <link rel="preload" href="assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/sources.css" />
  <script src="js/i18n.js"></script>
  <script src="js/ui/shell.js"></script>
</head>
<body>
  <div class="shell">
    <aterra-sidebar active="sources"></aterra-sidebar>

    <main class="shell-main" id="main" tabindex="-1">
      <div class="shell-content">
        <div class="page-head">
          <div>
            <h1 data-i18n="sources_title">Sources & evidence</h1>
            <p data-i18n="sources_subtitle">Every source behind every finding on 123 Example Avenue, in one place.</p>
          </div>
          <a href="property.html" class="btn btn-ghost" data-i18n="common_backToProperty">Back to property</a>
        </div>

        <div class="chain-diagram" aria-hidden="true">
          <div class="chain-node"><div class="cn-title" data-i18n="sources_chainFinding">Finding</div><div class="cn-sub" data-i18n="sources_chainFindingSub">What ATERRA concluded</div></div>
          <div class="chain-arrow"><svg viewBox="0 0 20 12" fill="none"><path d="M0 6h17M12 1l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="chain-node"><div class="cn-title" data-i18n="panel_evidence">Evidence</div><div class="cn-sub" data-i18n="sources_chainEvidenceSub">Why it matters, and how sure we are</div></div>
          <div class="chain-arrow"><svg viewBox="0 0 20 12" fill="none"><path d="M0 6h17M12 1l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <div class="chain-node"><div class="cn-title" data-i18n="panel_source">Source</div><div class="cn-sub" data-i18n="sources_chainSourceSub">The underlying record</div></div>
        </div>
        <p class="chain-tagline" data-i18n="sources_tagline">AI explains. Data proves. Professionals decide.</p>

        <div class="source-list" id="source-list"></div>
      </div>
    </main>
  </div>

  <script src="js/data/mockData.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/data/supabaseClient.js"></script>
  <script>
    (async function () {
      const P = window.ATERRA;
      const I = window.AterraI18N;
      const STATUS_DOT = { favorable: "var(--favorable-dot)", investigate: "var(--investigate-dot)", constraint: "var(--constraint-dot)", unknown: "var(--unknown-dot)" };

      // ---------- live backend (Supabase): same pattern as property.html —
      // fetch the real findings (each with its linked source rows), reshape
      // to the shape this page already expects, and overwrite P.sources/
      // P.findings. Falls back to the prototype mock data on any failure.
      try {
        const DEMO_PARCEL_ID = "a0000000-0000-4000-8000-000000000001";
        const project = await window.AterraDB.projectByParcelId(DEMO_PARCEL_ID);
        if (!project) throw new Error("No Supabase project found for this parcel.");
        const dbFindings = await window.AterraDB.findingsByProjectId(project.id);

        const sourceById = {};
        dbFindings.forEach((f) => f.sources.forEach((s) => {
          if (s && !sourceById[s.id]) {
            sourceById[s.id] = { id: s.id, name: s.name, agency: s.agency, document: s.document, date: s.published_at, section: s.section };
          }
        }));

        P.sources = Object.values(sourceById);
        P.findings = dbFindings.map((f) => ({
          id: f.id,
          category: f.category,
          title: f.title,
          sourceId: f.sources[0] ? f.sources[0].id : null,
        }));

        console.info("ATERRA: sources & findings are now live from Supabase.");
      } catch (err) {
        console.warn("ATERRA: sample database unreachable; using the bundled sample data.", err.message);
      }

      function referencingFindings(sourceId) {
        return P.findings.filter((f) => f.sourceId === sourceId);
      }

      document.getElementById("source-list").innerHTML = P.sources
        .map((s) => {
          const refs = referencingFindings(s.id);
          return `
        <div class="source-card">
          <div class="source-card-top">
            <div>
              <h3>${s.name}</h3>
              <div class="sc-agency">${s.agency}</div>
            </div>
            <button class="btn btn-ghost btn-sm sc-view-btn" data-view="${s.id}">${I.t("panel_viewSource")}</button>
          </div>
          <div class="sc-field-grid">
            <div class="sc-field"><div class="sc-label">${I.t("sources_documentLayer")}</div><div class="sc-value">${s.document}</div></div>
            <div class="sc-field"><div class="sc-label">${I.t("panel_date")}</div><div class="sc-value">${s.date}</div></div>
            <div class="sc-field"><div class="sc-label">${I.t("sources_relevantSection")}</div><div class="sc-value">${s.section}</div></div>
          </div>
          <div class="sc-referenced">
            <div class="sc-label">${I.t("sources_referencedBy")}</div>
            ${
              refs.length
                ? `<div class="sc-referenced-list">${refs
                    .map((f) => `<a class="sc-ref-chip" href="property.html?why=${f.id}"><span class="dot" style="background:${STATUS_DOT[f.category]}"></span>${I.tv(f.title)}</a>`)
                    .join("")}</div>`
                : `<p class="sc-no-refs">${I.t("sources_notCited")}</p>`
            }
          </div>
        </div>`;
        })
        .join("");

      document.querySelectorAll("[data-view]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const original = btn.textContent;
          btn.textContent = I.t("sources_opening");
          setTimeout(() => {
            btn.textContent = I.t("sources_notAvailable");
            setTimeout(() => (btn.textContent = original), 1400);
          }, 500);
        });
      });
    })();
  </script>
</body>
</html>
