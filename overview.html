<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overview — Parcela</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="shell">
    <aside class="shell-nav">
      <a href="landing.html" class="shell-brand">
        <span class="shell-brand-mark" aria-hidden="true"></span>
        Parcela
      </a>
      <ul class="shell-nav-list">
        <li><a href="overview.html" class="active"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="nav_overview">Overview</span><span class="nav-dot"></span></a></li>
        <li><a href="explore.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 6l5-2 4 2 5-2v10l-5 2-4-2-5 2V6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span data-i18n="nav_explore">Explore</span><span class="nav-dot"></span></a></li>
        <li><a href="properties.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><path d="M10 2l7 4v8l-7 4-7-4V6l7-4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span data-i18n="nav_properties">Properties</span><span class="nav-dot"></span></a></li>
        <li><a href="projects.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 8h14" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="nav_projects">Projects</span><span class="nav-dot"></span></a></li>
        <li><a href="reports.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><path d="M5 2h7l3 3v13H5V2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 10h4M8 13h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span data-i18n="nav_reports">Reports</span><span class="nav-dot"></span></a></li>
      </ul>
      <div class="shell-nav-footer"><span data-i18n="nav_footer">Prototype data · Puerto Rico</span><span id="lang-toggle-slot"></span></div>
    </aside>

    <div class="shell-main">
      <div class="shell-content">
        <div class="page-head">
          <div>
            <h1 id="greeting">Good afternoon.</h1>
            <p data-i18n="overview_subtitle">Here's where your properties and projects stand.</p>
          </div>
          <a href="index.html" class="btn btn-primary" data-i18n="common_analyzeProperty">Analyze a property</a>
        </div>

        <div class="dash-grid">
          <div>
            <div class="section-head">
              <h2 data-i18n="overview_recentProperties">Recent properties</h2>
              <a href="properties.html" class="btn-text text-sm" data-i18n="common_viewAll">View all</a>
            </div>
            <div class="property-grid" id="recent-properties"></div>

            <div class="section-head" style="margin-top:var(--sp-7);">
              <h2 data-i18n="overview_activeProjects">Active projects</h2>
              <a href="projects.html" class="btn-text text-sm" data-i18n="common_viewAll">View all</a>
            </div>
            <div id="active-projects"></div>
          </div>

          <div>
            <div class="section-head">
              <h2 data-i18n="overview_intelligenceUpdates">Intelligence updates</h2>
            </div>
            <div class="card" id="intelligence-updates" style="padding: var(--sp-2) var(--sp-4);"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/data/mockData.js"></script>
  <script>
    (function () {
      const P = window.PARCELA;
      const I = window.ParcelaI18N;
      const hour = new Date().getHours();
      const greetingKey = hour < 12 ? "overview_goodMorning" : hour < 18 ? "overview_goodAfternoon" : "overview_goodEvening";
      document.getElementById("greeting").textContent = I.t(greetingKey);

      const recent = document.getElementById("recent-properties");
      recent.innerHTML = P.comparisonProperties
        .map(
          (p) => `
        <a class="property-card" href="${p.id === P.property.id ? "property.html" : "#"}">
          <div class="pcard-top">
            <div>
              <h3>${p.address}</h3>
              <div class="pcard-muni">${p.municipality}, Puerto Rico</div>
            </div>
            <span class="status status-${p.status}">${I.t("common_status_" + p.status)}</span>
          </div>
          <div class="pcard-meta">
            <div class="field"><div class="m">${I.t("common_project")}</div><div class="v">${I.tv(p.projectType)}</div></div>
            <div class="field"><div class="m">${I.t("common_lastAnalyzed")}</div><div class="v">${p.lastAnalyzed}</div></div>
          </div>
        </a>`
        )
        .join("");

      const projects = document.getElementById("active-projects");
      projects.innerHTML = P.dashboard.activeProjects
        .map(
          (proj) => `
        <a class="project-card" href="projects.html" style="text-decoration:none; color:inherit;">
          <div>
            <h3>${proj.name}</h3>
            <div class="proj-meta">${I.tv(proj.unitsLabel)} · ${proj.investmentLabel}</div>
          </div>
          <div class="proj-count">
            <div class="n">${proj.propertiesCount}</div>
            <div class="l">${I.t("overview_propertiesLabel")}</div>
          </div>
        </a>`
        )
        .join("");

      const updates = document.getElementById("intelligence-updates");
      updates.innerHTML = P.dashboard.intelligenceUpdates
        .map(
          (u) => `
        <div class="update-row">
          <div class="update-icon">
            <svg viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.3"/><path d="M8 5v3l2 1.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </div>
          <div class="update-body">
            <div class="u-type">${I.tv(u.type)}</div>
            <div class="u-detail">${I.tv(u.detail)}</div>
          </div>
          <div class="update-date">${u.date}</div>
        </div>`
        )
        .join("");
    })();
  </script>
</body>
</html>
