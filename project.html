<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Workspace — Parcela</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/workspace.css" />
  <style>
    @media print {
      .ws-sidebar, .ws-topbar, .copilot-panel, .copilot-scrim, .next-move-banner, .changes-strip, .ws-nav-btn { display: none !important; }
      .ws-section { display: none !important; }
      .ws-section.print-active { display: block !important; }
      .workspace-shell { display: block; }
    }
  </style>
</head>
<body>
  <nav class="ws-topbar">
    <div class="wrap">
      <a href="index.html" class="brand">
        <svg class="brand-mark" viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M13 1.5 L24 7.5 V18.5 L13 24.5 L2 18.5 V7.5 Z" stroke="#12595c" stroke-width="1.6" fill="#e2eeed"/>
          <path d="M13 1.5 V13 L24 7.5" stroke="#12595c" stroke-width="1.6" fill="none"/>
          <path d="M13 13 L2 18.5 M13 13 L13 24.5" stroke="#12595c" stroke-width="1.6" fill="none"/>
        </svg>
        Parcela
      </a>
      <div class="ws-title" id="ws-title"></div>
      <div class="ws-actions">
        <select class="role-select" id="role-select"></select>
        <button class="btn btn-ghost btn-sm copilot-toggle" id="copilot-toggle-btn">Copilot <span class="dot" id="copilot-dot" hidden></span></button>
        <a href="projects.html" class="btn btn-ghost btn-sm">My Projects</a>
      </div>
    </div>
  </nav>

  <div class="workspace-shell">
    <aside class="ws-sidebar">
      <nav id="ws-nav"></nav>
    </aside>

    <main class="ws-main">
      <section class="ws-section active" data-section="overview" id="section-overview"></section>
      <section class="ws-section" data-section="roadmap" id="section-roadmap"></section>
      <section class="ws-section" data-section="documents" id="section-documents"></section>
      <section class="ws-section" data-section="professionals" id="section-professionals"></section>
      <section class="ws-section" data-section="budget" id="section-budget"></section>
      <section class="ws-section" data-section="financing" id="section-financing"></section>
      <section class="ws-section" data-section="build" id="section-build"></section>
      <section class="ws-section" data-section="activity" id="section-activity"></section>
    </main>
  </div>

  <div class="copilot-scrim" id="copilot-scrim"></div>
  <div class="copilot-panel" id="copilot-panel">
    <div class="copilot-header">
      <h3>Project Copilot</h3>
      <button class="btn btn-ghost btn-sm" id="copilot-close">Close</button>
    </div>
    <div class="copilot-messages" id="copilot-messages"></div>
    <div class="copilot-quick" id="copilot-quick"></div>
    <div class="copilot-input-row">
      <input type="text" id="copilot-input" placeholder="Ask about this project…" />
      <button class="btn btn-primary btn-sm" id="copilot-send">Send</button>
    </div>
  </div>

  <script src="js/data/zoning-rules.js"></script>
  <script src="js/data/properties.js"></script>
  <script src="js/data/professionals.js"></script>
  <script src="js/data/permitTemplates.js"></script>
  <script src="js/engine/analyzeProperty.js"></script>
  <script src="js/engine/permitEngine.js"></script>
  <script src="js/engine/budgetEngine.js"></script>
  <script src="js/engine/timelineEngine.js"></script>
  <script src="js/engine/financingEngine.js"></script>
  <script src="js/engine/documentIntelligence.js"></script>
  <script src="js/engine/nextMove.js"></script>
  <script src="js/engine/copilot.js"></script>
  <script src="js/state/workspace.js"></script>
  <script src="js/ui/icons.js"></script>
  <script src="js/ui/render.js"></script>
  <script src="js/ui/workspaceRender.js"></script>
  <script>
    (function () {
      window.PARCELA_WORKSPACE.seedFlagship();
      const WSR = window.PARCELA_WS_RENDER;
      const params = new URLSearchParams(window.location.search);
      let workspaceId = params.get("id");
      if (!workspaceId) workspaceId = "ws-caguas-adu-demo";

      let workspace = window.PARCELA_WORKSPACE.get(workspaceId);
      if (!workspace) {
        document.querySelector(".ws-main").innerHTML = `<div class="empty-state"><h2>We couldn't find that project</h2><p>The link may be out of date.</p><a href="projects.html" class="btn btn-primary">Back to My Projects</a></div>`;
        throw new Error("workspace not found");
      }

      const previousLastSeen = window.PARCELA_WORKSPACE.markSeen(workspaceId);
      const property = window.PARCELA_PROPERTIES.find((p) => p.id === workspace.propertyId);
      const zoning = window.PARCELA_ZONING[property.zoningCode];
      const flood = window.PARCELA_FLOOD_ZONES[property.floodZone];

      let currentRole = "owner";
      let currentSection = "overview";
      let pendingUploadMessage = null;
      let pendingEstimateMessage = null;

      const NAV_ITEMS = [
        { id: "overview", label: "Overview", icon: "info" },
        { id: "roadmap", label: "Roadmap & Permits", icon: "check" },
        { id: "documents", label: "Documents", icon: "renovate" },
        { id: "professionals", label: "Professionals", icon: "business" },
        { id: "budget", label: "Budget", icon: "multifamily" },
        { id: "financing", label: "Financing", icon: "home" },
        { id: "build", label: "Build Mode", icon: "adu" },
        { id: "activity", label: "Activity", icon: "unknown" }
      ];

      function refresh() {
        workspace = window.PARCELA_WORKSPACE.get(workspaceId);
        const roadmap = window.PARCELA_PERMIT_ENGINE.buildRoadmap(property, zoning, flood, workspace.scenarioId, workspace.permitStatus, workspace.status, workspace.assignments);
        const progress = window.PARCELA_PERMIT_ENGINE.progress(roadmap);
        const budgetSummary = window.PARCELA_BUDGET_ENGINE.summary(workspace, workspace.scenarioId);
        const timeline = window.PARCELA_TIMELINE_ENGINE.estimate(workspace, roadmap);
        const nextMove = window.PARCELA_NEXT_MOVE.compute(workspace, roadmap, budgetSummary);
        const changesSince = window.PARCELA_NEXT_MOVE.changesSince(workspace, previousLastSeen);
        const ctx = { workspace, property, roadmap, budgetSummary, timeline, nextMove, changesSince };

        renderTopbar(ctx); renderNav(ctx);
        renderOverview(ctx); renderRoadmap(ctx); renderDocuments(ctx); renderProfessionals(ctx);
        renderBudget(ctx); renderFinancing(ctx); renderBuild(ctx); renderActivity(ctx);
        applyRoleVisibility();
        return ctx;
      }

      function renderTopbar(ctx) {
        document.getElementById("ws-title").innerHTML = `<strong>${property.address}</strong><span>${ctx.workspace.scenarioTitle} · ${WSR.ROLE_LABELS[currentRole]} view</span>`;
        document.getElementById("copilot-dot").hidden = !ctx.nextMove.headline;
      }

      function renderNav(ctx) {
        const nav = document.getElementById("ws-nav");
        nav.innerHTML = NAV_ITEMS.map((item) => {
          let badge = "";
          if (item.id === "roadmap") badge = `${ctx.roadmap.filter((s) => s.status === "approved").length}/${ctx.roadmap.length}`;
          if (item.id === "documents") badge = String(ctx.workspace.documents.length);
          if (item.id === "build" && ctx.workspace.status !== "build" && ctx.workspace.status !== "complete") badge = "🔒";
          return `<button class="ws-nav-btn ${item.id === currentSection ? "active" : ""}" data-nav="${item.id}">${window.parcelaIcon(item.icon, 16)} ${item.label} ${badge ? `<span class="count">${badge}</span>` : ""}</button>`;
        }).join("");
        nav.querySelectorAll("[data-nav]").forEach((btn) => btn.addEventListener("click", () => { showSection(btn.dataset.nav); }));
      }

      function showSection(id) {
        currentSection = id;
        document.querySelectorAll(".ws-section").forEach((s) => s.classList.toggle("active", s.dataset.section === id));
        document.querySelectorAll("[data-nav]").forEach((b) => b.classList.toggle("active", b.dataset.nav === id));
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      // ---------- OVERVIEW ----------
      function renderOverview(ctx) {
        const el = document.getElementById("section-overview");
        const changesHtml = ctx.changesSince.length
          ? `<div class="changes-strip"><strong>Since your last visit (${new Date(previousLastSeen).toLocaleDateString()}):</strong> ${ctx.changesSince.length} update${ctx.changesSince.length === 1 ? "" : "s"} — ${ctx.changesSince.slice(0, 3).map((a) => a.text).join(" ")}</div>`
          : "";
        el.innerHTML = `
          <div class="next-move-banner">
            <div>
              <div class="nm-label">Your Next Move</div>
              <h2>${ctx.nextMove.headline}</h2>
              <p>${ctx.nextMove.detail}</p>
            </div>
            ${ctx.nextMove.cta ? `<button class="btn btn-primary nm-cta" data-goto="${ctx.nextMove.section}">${ctx.nextMove.cta}</button>` : ""}
          </div>
          ${changesHtml}
          <div class="stat-grid">
            <div class="card stat-card">
              <div class="stat-label">Roadmap progress</div>
              <div class="stat-value">${ctx.roadmap.filter((s) => s.status === "approved").length}/${ctx.roadmap.length}</div>
              <div class="progress-track" style="margin-top:8px;"><div class="progress-fill" style="width:${window.PARCELA_PERMIT_ENGINE.progress(ctx.roadmap).pct}%;"></div></div>
            </div>
            <div class="card stat-card">
              <div class="stat-label">Budget logged</div>
              <div class="stat-value">$${ctx.budgetSummary.totalAccepted.toLocaleString()}</div>
              <div class="stat-sub">of an estimated $${ctx.budgetSummary.totalRangeMin.toLocaleString()}–$${ctx.budgetSummary.totalRangeMax.toLocaleString()}</div>
            </div>
            <div class="card stat-card">
              <div class="stat-label">Estimated time remaining</div>
              <div class="stat-value">${ctx.timeline.estimatedWeeksMin}–${ctx.timeline.estimatedWeeksMax} wks</div>
              <div class="stat-sub">${ctx.timeline.riskFactors[0] ? "Risk: " + ctx.timeline.riskFactors[0].label : "No major flagged risks"}</div>
            </div>
          </div>
          <div class="section-title"><h2>Property & scenario</h2></div>
          <div class="card" style="margin-bottom: var(--sp-6);">
            <p><strong>${property.address}</strong>, ${property.barrio}, ${property.municipio} — ${zoning.code} ${zoning.name}</p>
            <p style="margin-bottom:0;">Scenario: <strong>${ctx.workspace.scenarioTitle}</strong> · Status: ${WSR.statusPill(ctx.workspace.status, ctx.workspace.status)}</p>
            <a class="btn btn-ghost btn-sm" style="margin-top: var(--sp-3);" href="dashboard.html?id=${property.id}&goal=${ctx.workspace.goalId}">View full Property Intelligence Report →</a>
          </div>
          <div class="section-title"><h2>Recent activity</h2></div>
          <div class="card">${ctx.workspace.activity.slice(0, 3).map(WSR.activityItem).join("")}</div>
        `;
        el.querySelectorAll("[data-goto]").forEach((b) => b.addEventListener("click", () => showSection(b.dataset.goto)));
      }

      // ---------- ROADMAP ----------
      function renderRoadmap(ctx) {
        const el = document.getElementById("section-roadmap");
        el.innerHTML = `
          <div class="section-title"><div><p class="eyebrow">Permit intelligence</p><h2>Roadmap & Permits</h2></div></div>
          <p class="text-sm">Each requirement shows why it's needed, what it depends on, and what to do next. Statuses are set by you and your team — Parcela tracks and explains them, it doesn't submit anything on your behalf.</p>
          <div style="margin-top: var(--sp-5);">${ctx.roadmap.map((s, i) => WSR.chainItem(s, i, ctx.roadmap.length)).join("")}</div>
        `;
        el.querySelectorAll(".status-select").forEach((sel) => {
          sel.addEventListener("change", () => {
            window.PARCELA_WORKSPACE.setPermitStatus(workspaceId, sel.dataset.step, sel.value, "You");
            refresh();
          });
        });
      }

      // ---------- DOCUMENTS ----------
      function renderDocuments(ctx) {
        const el = document.getElementById("section-documents");
        const typeOptions = Object.entries(window.PARCELA_DOCUMENT_ENGINE.TYPE_LABELS).map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
        el.innerHTML = `
          <div class="section-title"><div><p class="eyebrow">Document assistant</p><h2>Documents</h2></div></div>
          <div class="card">
            <p class="text-sm">Upload a deed, plans, survey, estimate, government letter, permit, contractor proposal, or inspection report. There's no real OCR in this prototype — tag the type and Parcela returns the kind of findings an AI reading that document would plausibly flag.</p>
            <div class="doc-upload-row">
              <div><label>Document type</label><select id="doc-type">${typeOptions}</select></div>
              <div style="max-width:280px;"><label>File (optional, decorative)</label><input type="file" id="doc-file" /></div>
              <button class="btn btn-primary" id="doc-upload-btn">Upload & analyze</button>
            </div>
            <div id="doc-upload-result">${pendingUploadMessage || ""}</div>
          </div>
          <div class="section-title" style="margin-top: var(--sp-6);"><h2>Uploaded documents</h2></div>
          ${ctx.workspace.documents.length ? ctx.workspace.documents.map(WSR.docCard).join("") : `<p class="muted">No documents yet.</p>`}
        `;
        pendingUploadMessage = null;
        document.getElementById("doc-upload-btn").addEventListener("click", () => {
          const type = document.getElementById("doc-type").value;
          const fileInput = document.getElementById("doc-file");
          const result = window.PARCELA_DOCUMENT_ENGINE.process(type);
          const name = fileInput.files.length ? fileInput.files[0].name : `${window.PARCELA_DOCUMENT_ENGINE.TYPE_LABELS[type]} — uploaded ${new Date().toLocaleDateString()}`;
          window.PARCELA_WORKSPACE.addDocument(workspaceId, { name, type, extracted: result.extracted });
          pendingUploadMessage = `<div class="unknown-item" style="margin-top: var(--sp-4); background: var(--teal-050); border-color: var(--teal-100);"><div><div class="u-title">AI Copilot</div><p>${result.message}</p></div></div>`;
          refresh();
          showSection("documents");
        });
      }

      // ---------- PROFESSIONALS ----------
      function renderProfessionals(ctx) {
        const el = document.getElementById("section-professionals");
        const assignedIds = new Set(Object.values(ctx.workspace.assignments).filter(Boolean));
        if (ctx.workspace.buildMode.contractorId) assignedIds.add(ctx.workspace.buildMode.contractorId);
        const assigned = [...assignedIds].map(WSR.proById).filter(Boolean);
        const needed = ctx.roadmap.filter((s) => s.professionalCategory && !s.assignedProfessionalId && s.status !== "approved");

        el.innerHTML = `
          <div class="section-title"><div><p class="eyebrow">Your team</p><h2>Professionals</h2></div></div>
          <h3>Assigned to this project</h3>
          <div class="pro-grid" style="margin-bottom: var(--sp-6);">${assigned.length ? assigned.map((p) => WSR.proCard(p)).join("") : `<p class="muted">No one assigned yet.</p>`}</div>
          ${needed.length ? `<h3>AI-identified needs</h3><div class="pro-grid">${needed.map((s) => {
            const candidates = window.PARCELA_PROFESSIONALS.filter((p) => p.category === s.professionalCategory).slice(0, 2);
            return `<div class="card pro-needed-card">
              <p style="margin-bottom:6px;"><strong>Your project appears to require a ${s.professionalCategory}</strong> for "${s.label}."</p>
              <p class="text-sm">${s.why}</p>
              ${candidates.map((c) => `<div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">
                <span class="text-sm"><strong>${c.name}</strong> — ${c.firm}</span>
                <button class="btn btn-ghost btn-sm assign-btn" data-step="${s.id}" data-pro="${c.id}">Assign</button>
              </div>`).join("")}
              <a href="professionals.html?category=${s.professionalCategory}" class="btn btn-ghost btn-sm" style="margin-top: var(--sp-3);">Find qualified professionals →</a>
            </div>`;
          }).join("")}</div>` : `<p class="muted">Nothing outstanding — every remaining step has someone assigned.</p>`}
        `;
        el.querySelectorAll(".assign-btn").forEach((b) => b.addEventListener("click", () => {
          window.PARCELA_WORKSPACE.assignProfessional(workspaceId, b.dataset.step, b.dataset.pro, "You");
          refresh(); showSection("professionals");
        }));
      }

      // ---------- BUDGET ----------
      function renderBudget(ctx) {
        const el = document.getElementById("section-budget");
        const catOptions = Object.entries(ctx.budgetSummary.CATEGORY_LABELS).map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
        el.innerHTML = `
          <div class="section-title"><div><p class="eyebrow">Cost intelligence</p><h2>Budget</h2></div></div>
          <div class="card budget-total-card">
            <div><div class="stat-label">Total accepted</div><div class="stat-value">$${ctx.budgetSummary.totalAccepted.toLocaleString()}</div></div>
            <div><div class="stat-label">Estimated range</div><div class="stat-value">$${ctx.budgetSummary.totalRangeMin.toLocaleString()}–$${ctx.budgetSummary.totalRangeMax.toLocaleString()}</div></div>
            ${ctx.budgetSummary.changeOrderTotal ? `<div><div class="stat-label">Pending change orders</div><div class="stat-value">+$${ctx.budgetSummary.changeOrderTotal.toLocaleString()}</div></div>` : ""}
          </div>
          <div class="card">
            ${ctx.budgetSummary.byCategory.map((c) => `
              <div class="budget-row">
                <div class="budget-row-top"><strong>${c.label}</strong><span>${c.accepted ? "$" + c.accepted.toLocaleString() : "—"} <span class="muted">(range $${c.range[0].toLocaleString()}–$${c.range[1].toLocaleString()})</span></span></div>
                ${WSR.budgetBar(c.range, c.accepted, c.evalResult)}
                ${c.evalResult && c.evalResult.withinRange === false ? `<div class="budget-note flag">${c.evalResult.message}</div>` : c.accepted ? `<div class="budget-note ok">${c.evalResult.message}</div>` : ""}
              </div>`).join("")}
          </div>
          <div class="section-title" style="margin-top: var(--sp-6);"><h2>Log or check an estimate</h2></div>
          <div class="card">
            <p class="text-sm">Try submitting a contractor estimate — Parcela will flag it if it's well outside the current range for that category. Ranges are estimates, not guarantees.</p>
            <div class="estimate-form">
              <div><label>Category</label><select id="est-category">${catOptions}</select></div>
              <div><label>Amount (USD)</label><input type="text" id="est-amount" placeholder="e.g. 42000" /></div>
              <div><label>Submitted by</label><input type="text" id="est-by" placeholder="e.g. your contractor's name" /></div>
              <button class="btn btn-primary" id="est-submit-btn">Log estimate</button>
            </div>
            <div id="estimate-result">${pendingEstimateMessage || ""}</div>
          </div>
        `;
        pendingEstimateMessage = null;
        document.getElementById("est-submit-btn").addEventListener("click", () => {
          const category = document.getElementById("est-category").value;
          const amount = parseFloat(document.getElementById("est-amount").value.replace(/[^0-9.]/g, ""));
          const by = document.getElementById("est-by").value.trim() || "You";
          if (!amount || amount <= 0) {
            document.getElementById("estimate-result").innerHTML = `<div class="budget-note flag" style="margin-top: var(--sp-3);">Enter a valid amount first.</div>`;
            return;
          }
          const ranges = window.PARCELA_BUDGET_ENGINE.getCategoryRanges(ctx.workspace.scenarioId);
          const evalResult = window.PARCELA_BUDGET_ENGINE.evaluateEstimate(ranges, category, amount);
          window.PARCELA_WORKSPACE.addEstimate(workspaceId, { category, amount, submittedBy: by });
          pendingEstimateMessage = `<div class="budget-note ${evalResult.withinRange === false ? "flag" : "ok"}" style="margin-top: var(--sp-3);">${evalResult.message}</div>`;
          refresh(); showSection("budget");
        });
      }

      // ---------- FINANCING ----------
      function renderFinancing(ctx) {
        const el = document.getElementById("section-financing");
        const pkg = window.PARCELA_FINANCING_ENGINE.assemble(ctx.workspace, property, ctx.workspace.scenarioTitle, ctx.roadmap, ctx.budgetSummary, ctx.timeline);
        el.innerHTML = `
          <div class="section-title"><div><p class="eyebrow">Financing readiness</p><h2>Financing Package</h2></div></div>
          <p class="text-sm">Auto-assembled from this project's own data. This is a planning summary, not a loan application or financial advice.</p>
          <div class="card" style="margin-top: var(--sp-5);">
            <p><strong>${pkg.property.address}</strong>, ${pkg.property.barrio}, ${pkg.property.municipio} — ${pkg.property.zoningCode}, ${pkg.property.lotSizeM2.toLocaleString()} m²</p>
            <p>Development plan: <strong>${pkg.developmentPlan.scenarioTitle}</strong> — ${pkg.developmentPlan.roadmapProgress.done}/${pkg.developmentPlan.roadmapProgress.total} roadmap steps approved, status: ${pkg.developmentPlan.status}.</p>
            <div class="financing-grid">
              <div><div class="stat-label">Estimated cost range</div><div class="stat-value" style="font-size:1.15rem;">$${pkg.estimatedCosts.rangeMin.toLocaleString()}–$${pkg.estimatedCosts.rangeMax.toLocaleString()}</div><div class="stat-sub">$${pkg.estimatedCosts.accepted.toLocaleString()} accepted so far</div></div>
              <div><div class="stat-label">Estimated timeline remaining</div><div class="stat-value" style="font-size:1.15rem;">${pkg.timeline.weeksMin}–${pkg.timeline.weeksMax} weeks</div><div class="stat-sub">${pkg.timeline.riskFactors[0] ? pkg.timeline.riskFactors[0].label : "No major flagged risks"}</div></div>
            </div>
            ${pkg.expectedIncome ? `<p><strong>Expected income (assumption):</strong> $${pkg.expectedIncome.rangeMin.toLocaleString()}–$${pkg.expectedIncome.rangeMax.toLocaleString()} ${pkg.expectedIncome.unit}. <span class="muted">${pkg.expectedIncome.assumption}</span></p>` : `<p class="muted">No income assumption generated for this scenario type.</p>`}
            <button class="btn btn-dark btn-sm" onclick="window.print()">Print / Download package</button>
          </div>
          <div class="section-title" style="margin-top: var(--sp-6);"><h2>Assumptions & disclaimers</h2></div>
          <div class="disclaimer-box"><ul style="margin:0; padding-left:1.2em;">${pkg.disclaimers.map((d) => `<li>${d}</li>`).join("")}</ul></div>
        `;
      }

      // ---------- BUILD MODE ----------
      function renderBuild(ctx) {
        const el = document.getElementById("section-build");
        if (ctx.workspace.status !== "build" && ctx.workspace.status !== "complete") {
          el.innerHTML = `
            <div class="section-title"><div><p class="eyebrow">Construction</p><h2>Build Mode</h2></div></div>
            <div class="card empty-state">
              <h3>Build Mode unlocks once permits are approved</h3>
              <p>${window.PARCELA_PERMIT_ENGINE.progress(ctx.roadmap).done}/${window.PARCELA_PERMIT_ENGINE.progress(ctx.roadmap).total} steps approved so far.</p>
            </div>`;
          return;
        }
        const contractor = ctx.workspace.buildMode.contractorId ? WSR.proById(ctx.workspace.buildMode.contractorId) : null;
        el.innerHTML = `
          <div class="section-title"><div><p class="eyebrow">Construction</p><h2>Build Mode</h2></div></div>
          ${contractor ? `<div class="card" style="margin-bottom: var(--sp-5);"><h4 style="margin-bottom:4px;">General contractor</h4><p style="margin-bottom:0;">${contractor.name} — ${contractor.firm}</p></div>` : ""}
          <h3>Milestones</h3>
          <div class="card" style="margin-bottom: var(--sp-6);">
            ${ctx.workspace.buildMode.milestones.map((m) => `
              <div class="milestone-row">
                <span class="m-label">${m.label}</span>
                ${m.note ? `<span class="m-note">${m.note}</span>` : ""}
                ${WSR.statusPill(m.status === "complete" ? "approved" : m.status === "in-progress" ? "preparing" : "not-started", m.status.replace("-", " "))}
              </div>`).join("")}
          </div>
          <h3>Change orders</h3>
          ${ctx.workspace.buildMode.changeOrders.length ? ctx.workspace.buildMode.changeOrders.map((co) => {
            const evalResult = window.PARCELA_BUDGET_ENGINE.evaluateChangeOrder(ctx.workspace, co.amountDelta);
            return `<div class="co-card">
              <p style="margin-bottom:6px;"><strong>+$${co.amountDelta.toLocaleString()}</strong> (${evalResult.pct}% increase) — ${co.status}</p>
              <p class="text-sm" style="margin-bottom:8px;">${co.description}</p>
              ${co.status === "pending" ? `<div style="display:flex; gap:8px;"><button class="btn btn-primary btn-sm co-approve" data-id="${co.id}">Approve</button><button class="btn btn-ghost btn-sm co-reject" data-id="${co.id}">Reject</button></div>` : ""}
            </div>`;
          }).join("") : `<p class="muted">No change orders.</p>`}
          <h3 style="margin-top: var(--sp-6);">Progress photos</h3>
          <div class="card" style="margin-bottom: var(--sp-5);">
            <p class="text-sm">Log a progress photo with an area and a note. Parcela compares your note against the approved scope and flags anything worth a second look — try mentioning "different" or "offset" to see it trigger.</p>
            <div class="estimate-form">
              <div><label>Area</label><input type="text" id="photo-area" placeholder="e.g. Area C - kitchen" /></div>
              <div style="flex:2;"><label>Note</label><input type="text" id="photo-note" placeholder="What does this show?" /></div>
              <button class="btn btn-primary" id="photo-upload-btn">Log photo</button>
            </div>
          </div>
          ${ctx.workspace.buildMode.photos.map((p) => `
            <div class="card photo-card ${p.flagged ? "flagged" : ""}">
              <div class="photo-thumb">${p.areaLabel}</div>
              <p class="text-sm" style="margin-bottom:${p.flagged ? "8px" : "0"};">${p.note} <span class="muted">— ${new Date(p.uploadedAt).toLocaleDateString()}</span></p>
              ${p.flagged ? `<p class="text-sm" style="color: var(--rust-700); margin-bottom:0;"><strong>AI Copilot:</strong> ${p.flagReason}</p>` : ""}
            </div>`).join("")}
          <h3 style="margin-top: var(--sp-6);">Invoices</h3>
          <div class="card">${ctx.workspace.buildMode.invoices.map((inv) => `<div class="milestone-row"><span class="m-label">${inv.label}</span><span class="m-note">$${inv.amount.toLocaleString()} · ${new Date(inv.date).toLocaleDateString()}</span>${WSR.statusPill(inv.status === "paid" ? "approved" : "ready", inv.status)}</div>`).join("")}</div>
          <h3 style="margin-top: var(--sp-6);">Inspections</h3>
          <div class="card">${ctx.workspace.buildMode.inspections.map((i) => `<div class="milestone-row"><span class="m-label">${i.label}</span><span class="m-note">${i.note || ""}</span>${WSR.statusPill(i.status, i.status.replace("-", " "))}</div>`).join("")}</div>
        `;
        el.querySelectorAll(".co-approve, .co-reject").forEach((b) => b.addEventListener("click", () => {
          const w = window.PARCELA_WORKSPACE.get(workspaceId);
          const co = w.buildMode.changeOrders.find((c) => c.id === b.dataset.id);
          co.status = b.classList.contains("co-approve") ? "approved" : "rejected";
          window.PARCELA_WORKSPACE.save(w);
          window.PARCELA_WORKSPACE.appendActivity(workspaceId, "You", `${co.status === "approved" ? "Approved" : "Rejected"} the change order for +$${co.amountDelta.toLocaleString()}.`);
          refresh(); showSection("build");
        }));
        document.getElementById("photo-upload-btn").addEventListener("click", () => {
          const area = document.getElementById("photo-area").value.trim() || "Unlabeled area";
          const note = document.getElementById("photo-note").value.trim() || "Progress photo";
          const flagged = /different|offset|unsure|doesn't match|mismatch/i.test(note);
          const w = window.PARCELA_WORKSPACE.get(workspaceId);
          w.buildMode.photos.unshift({ id: "ph_" + Date.now(), areaLabel: area, note, uploadedAt: new Date().toISOString(), flagged,
            flagReason: flagged ? `This photo's note suggests work in "${area}" may differ from the approved scope. Consider asking your contractor for clarification.` : null });
          window.PARCELA_WORKSPACE.save(w);
          window.PARCELA_WORKSPACE.appendActivity(workspaceId, "You", `Uploaded a progress photo — ${area}.${flagged ? " AI flagged it for review." : ""}`);
          refresh(); showSection("build");
        });
      }

      // ---------- ACTIVITY ----------
      function renderActivity(ctx) {
        const el = document.getElementById("section-activity");
        el.innerHTML = `
          <div class="section-title"><div><p class="eyebrow">Collaboration</p><h2>Activity</h2></div></div>
          <h3>People on this project</h3>
          <div class="card" style="margin-bottom: var(--sp-5);">
            ${ctx.workspace.collaborators.map(WSR.collabRow).join("")}
            <div class="estimate-form" style="margin-top: var(--sp-4);">
              <div><label>Name</label><input type="text" id="collab-name" placeholder="e.g. Jane Doe" /></div>
              <div><label>Role</label><select id="collab-role">${Object.entries(WSR.ROLE_LABELS).filter(([k]) => k !== "owner").map(([v, l]) => `<option value="${v}">${l}</option>`).join("")}</select></div>
              <button class="btn btn-ghost" id="collab-add-btn">Invite (demo)</button>
            </div>
            <p class="text-sm muted" style="margin-top:8px; margin-bottom:0;">This prototype simulates collaboration with a "Viewing as" switch in the top bar rather than real invitations/accounts.</p>
          </div>
          <h3>Shared activity timeline</h3>
          <div class="card">${ctx.workspace.activity.map(WSR.activityItem).join("")}</div>
        `;
        document.getElementById("collab-add-btn").addEventListener("click", () => {
          const name = document.getElementById("collab-name").value.trim();
          const role = document.getElementById("collab-role").value;
          if (!name) return;
          window.PARCELA_WORKSPACE.addCollaborator(workspaceId, { name, roleLabel: WSR.ROLE_LABELS[role], category: role });
          refresh(); showSection("activity");
        });
      }

      // ---------- ROLE VISIBILITY ----------
      function applyRoleVisibility() {
        const visible = WSR.ROLE_SECTIONS[currentRole];
        NAV_ITEMS.forEach((item) => {
          const btn = document.querySelector(`[data-nav="${item.id}"]`);
          if (btn) btn.style.opacity = visible.includes(item.id) ? "1" : "0.35";
        });
      }

      function initRoleSelect() {
        const sel = document.getElementById("role-select");
        sel.innerHTML = Object.entries(WSR.ROLE_LABELS).map(([v, l]) => `<option value="${v}">Viewing as: ${l}</option>`).join("");
        sel.addEventListener("change", () => { currentRole = sel.value; applyRoleVisibility(); refresh(); });
      }

      // ---------- COPILOT ----------
      function initCopilot() {
        const panel = document.getElementById("copilot-panel"), scrim = document.getElementById("copilot-scrim");
        const openPanel = () => { panel.classList.add("open"); scrim.classList.add("open"); };
        const closePanel = () => { panel.classList.remove("open"); scrim.classList.remove("open"); };
        document.getElementById("copilot-toggle-btn").addEventListener("click", openPanel);
        document.getElementById("copilot-close").addEventListener("click", closePanel);
        scrim.addEventListener("click", closePanel);

        const quick = document.getElementById("copilot-quick");
        quick.innerHTML = window.PARCELA_COPILOT.QUICK_PROMPTS.map((q) => `<button type="button">${q}</button>`).join("");
        quick.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => sendMessage(b.textContent)));

        document.getElementById("copilot-send").addEventListener("click", () => {
          const input = document.getElementById("copilot-input");
          if (input.value.trim()) { sendMessage(input.value.trim()); input.value = ""; }
        });
        document.getElementById("copilot-input").addEventListener("keydown", (e) => {
          if (e.key === "Enter") document.getElementById("copilot-send").click();
        });

        pushMessage("ai", "Ask me anything about this project — what's next, what's blocking you, budget, who to hire, or what's changed.");
      }

      function pushMessage(role, text) {
        const box = document.getElementById("copilot-messages");
        const div = document.createElement("div");
        div.className = `copilot-msg ${role}`;
        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      }

      function sendMessage(question) {
        pushMessage("user", question);
        const ctx = refresh();
        const answer = window.PARCELA_COPILOT.ask(question, ctx);
        setTimeout(() => pushMessage("ai", answer), 250);
      }

      // ---------- boot ----------
      initRoleSelect();
      initCopilot();
      refresh();
    })();
  </script>
</body>
</html>
