<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My projects — ATERRA</title>
  <meta name="theme-color" content="#101D32" />
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/brand/app-icon.png" />
  <link rel="preload" href="assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <script src="js/i18n.js"></script>
  <script src="js/ui/shell.js"></script>
</head>
<body>
  <div class="shell">
    <aterra-sidebar active="projects" status="none"></aterra-sidebar>

    <main class="shell-main" id="main" tabindex="-1">
      <div class="shell-content">
        <div class="page-head">
          <div>
            <h1 data-i18n="myprojects_title">My projects</h1>
            <p id="account-line"></p>
          </div>
          <a href="search.html" class="btn btn-primary" data-i18n="myprojects_new">Analyze a property</a>
        </div>

        <p class="text-sm" id="projects-message" hidden></p>
        <div class="property-grid" id="project-list"></div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/data/supabaseClient.js"></script>
  <script src="js/data/live.js"></script>
  <script src="js/data/account.js"></script>
  <script>
    (async function () {
      const I = window.AterraI18N;
      const A = window.AterraAccount;
      const list = document.getElementById("project-list");
      const message = document.getElementById("projects-message");
      const accountLine = document.getElementById("account-line");
      const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const TYPE_KEYS = { Multifamily: "setup_multifamily", Commercial: "setup_commercial", Hospitality: "setup_hospitality", Industrial: "setup_industrial", "Mixed-use": "setup_mixedUse", Residential: "setup_residential", Other: "setup_other" };

      function say(text, html) {
        message.hidden = false;
        if (html) message.innerHTML = html; else message.textContent = text;
      }

      let user;
      try {
        user = await A.user();
      } catch (err) {
        say(I.t("overview_savedUnavailable"));
        return;
      }
      if (!user) {
        say(null, `${esc(I.t("myprojects_signedOut"))} <a href="signin.html?next=projects.html">${esc(I.t("signin_send"))}</a>`);
        return;
      }
      accountLine.innerHTML = `${esc(I.t("signin_doneBody"))} <strong>${esc(user.email)}</strong> · <button class="btn-text text-sm" id="signout">${esc(I.t("signin_signOut"))}</button>`;
      document.getElementById("signout").addEventListener("click", async () => {
        await A.signOut();
        location.reload();
      });

      let projects;
      try {
        projects = await A.listProjects();
      } catch (err) {
        console.error("ATERRA: could not load projects", err);
        say(I.t("myprojects_loadError"));
        return;
      }
      if (!projects.length) {
        say(I.t("myprojects_empty"));
        return;
      }

      list.innerHTML = projects
        .map((p) => {
          const sm = p.summary || {};
          const counts = sm.counts || {};
          const fit = sm.fit;
          const status = fit ? fit.category : (counts.constraint ? "constraint" : "investigate");
          const type = TYPE_KEYS[p.project_type] ? I.t(TYPE_KEYS[p.project_type]) : (p.project_type || "—");
          const title = p.address ? p.address.split(",")[0] : `${I.t("live_parcel")} ${p.cadastral}`;
          const saved = new Date(p.updated_at).toLocaleDateString(I.lang === "es" ? "es-PR" : "en-US", { month: "short", day: "numeric", year: "numeric" });
          return `
        <div class="property-card" data-id="${esc(p.id)}">
          <a href="property.html?parcel=${encodeURIComponent(p.cadastral)}" data-open="${esc(p.id)}" style="color:inherit;text-decoration:none;display:block;">
            <div class="pcard-top">
              <div>
                <h3>${esc(title)}</h3>
                <div class="pcard-muni">${esc(p.cadastral)} · ${esc(type)}${p.units ? ` · ${esc(p.units)}` : ""}</div>
              </div>
              <span class="status status-${esc(status)}">${esc(fit ? I.tv(fit.title) : I.tv(sm.feasibility) || "")}</span>
            </div>
            <div class="pcard-meta">
              <div class="field"><div class="m">${esc(I.t("projects_constraints"))}</div><div class="v">${counts.constraint || 0}</div></div>
              <div class="field"><div class="m">${esc(I.t("compare_unknowns"))}</div><div class="v">${counts.unknown || 0}</div></div>
              <div class="field"><div class="m">${esc(I.t("myprojects_saved"))}</div><div class="v">${esc(saved)}</div></div>
            </div>
          </a>
          <div style="display:flex;gap:16px;margin-top:8px;">
            <a class="btn-text text-sm" href="reports.html?parcel=${encodeURIComponent(p.cadastral)}${p.project_type ? `&type=${encodeURIComponent(p.project_type)}` : ""}">${esc(I.t("reports_title"))}</a>
            <button class="btn-text text-sm" data-delete="${esc(p.id)}">${esc(I.t("myprojects_delete"))}</button>
          </div>
        </div>`;
        })
        .join("");

      // Opening a project restores its setup answers before the property page loads.
      list.querySelectorAll("[data-open]").forEach((a) => {
        a.addEventListener("click", () => {
          const p = projects.find((x) => x.id === a.dataset.open);
          window.AterraLive.saveProject({ type: p.project_type || "Other", units: p.units || "", investment: p.investment || "" });
        });
      });
      list.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm(I.t("myprojects_confirmDelete"))) return;
          btn.disabled = true;
          try {
            await A.deleteProject(btn.dataset.delete);
            btn.closest(".property-card").remove();
            if (!list.children.length) say(I.t("myprojects_empty"));
          } catch (err) {
            console.error("ATERRA: delete failed", err);
            btn.disabled = false;
          }
        });
      });
    })();
  </script>
</body>
</html>
