<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Condado Multifamily — Parcela</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="shell">
    <aside class="shell-nav">
      <a href="landing.html" class="shell-brand">
        <span class="shell-brand-mark" aria-hidden="true"></span>
        Parcela
      </a>
      <ul class="shell-nav-list">
        <li><a href="overview.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="nav_overview">Overview</span><span class="nav-dot"></span></a></li>
        <li><a href="explore.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 6l5-2 4 2 5-2v10l-5 2-4-2-5 2V6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span data-i18n="nav_explore">Explore</span><span class="nav-dot"></span></a></li>
        <li><a href="properties.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><path d="M10 2l7 4v8l-7 4-7-4V6l7-4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span data-i18n="nav_properties">Properties</span><span class="nav-dot"></span></a></li>
        <li><a href="projects.html" class="active"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 8h14" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="nav_projects">Projects</span><span class="nav-dot"></span></a></li>
        <li><a href="reports.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><path d="M5 2h7l3 3v13H5V2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 10h4M8 13h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span data-i18n="nav_reports">Reports</span><span class="nav-dot"></span></a></li>
      </ul>
      <div class="shell-nav-footer"><span data-i18n="nav_footer">Prototype data · Puerto Rico</span><span id="lang-toggle-slot"></span></div>
    </aside>

    <div class="shell-main">
      <div class="shell-content">
        <div class="page-head">
          <div>
            <span class="eyebrow" id="proj-eyebrow"></span>
            <h1 id="proj-name"></h1>
            <p id="proj-meta"></p>
          </div>
          <a href="compare.html" class="btn btn-ghost" data-i18n="common_compareProperties">Compare properties</a>
        </div>

        <div class="section-head">
          <h2 data-i18n="projects_evaluated">Properties being evaluated</h2>
          <button class="btn-text text-sm" id="add-property" data-i18n="projects_addAnother">+ Add another property</button>
        </div>
        <div class="property-grid" id="project-properties"></div>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/data/mockData.js"></script>
  <script>
    (function () {
      const P = window.PARCELA;
      const I = window.ParcelaI18N;

      document.getElementById("proj-eyebrow").textContent = I.t("projects_project");
      document.getElementById("proj-name").textContent = P.project.name;
      document.getElementById("proj-meta").textContent = `${I.tv(P.project.unitsLabel)} · ${P.project.investmentLabel}`;

      document.getElementById("project-properties").innerHTML = P.comparisonProperties
        .map(
          (p) => `
        <a class="property-card" href="${p.id === P.property.id ? "property.html" : "#"}">
          <div class="pcard-top">
            <div>
              <h3>${I.tv(p.label)}</h3>
              <div class="pcard-muni">${p.address}</div>
            </div>
            <span class="status status-${p.status}">${I.tv(p.statusLabel)}</span>
          </div>
          <div class="pcard-meta">
            <div class="field"><div class="m">${I.t("compare_unknowns")}</div><div class="v">${p.unknownsCount}</div></div>
            <div class="field"><div class="m">${I.t("projects_constraints")}</div><div class="v">${p.constraintsCount}</div></div>
          </div>
        </a>`
        )
        .join("");

      document.getElementById("add-property").addEventListener("click", () => {
        window.location.href = "index.html";
      });
    })();
  </script>
</body>
</html>
