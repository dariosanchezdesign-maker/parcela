<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Properties — ATERRA</title>
  <meta name="theme-color" content="#101D32" />
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/brand/app-icon.png" />
  <link rel="preload" href="assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <script src="js/i18n.js"></script>
  <script src="js/ui/shell.js"></script>
</head>
<body>
  <div class="shell">
    <aterra-sidebar active="properties"></aterra-sidebar>

    <main class="shell-main" id="main" tabindex="-1">
      <div class="shell-content">
        <div class="page-head">
          <div>
            <h1 data-i18n="properties_title">Properties</h1>
            <p data-i18n="properties_subtitle">Every property you've analyzed. Select two or more to compare.</p>
          </div>
          <div style="display:flex; gap:var(--sp-3); flex-wrap:wrap;">
            <button type="button" class="btn btn-ghost" id="compare-quick-btn" data-i18n="common_compareProperties">Compare properties</button>
            <a href="search.html" class="btn btn-primary" data-i18n="common_analyzeProperty">Analyze a property</a>
          </div>
        </div>

        <div class="property-grid" id="property-list"></div>

        <div class="compare-bar">
          <span class="cb-count"><strong id="selected-count">0</strong> <span data-i18n="properties_selected">selected</span></span>
          <button class="btn btn-primary" id="compare-btn" disabled data-i18n="common_compareProperties">Compare properties</button>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data/mockData.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/data/supabaseClient.js"></script>
  <script>
    (async function () {
      const P = window.ATERRA;
      const I = window.AterraI18N;
      const list = document.getElementById("property-list");
      // The only property with its own dedicated detail page today —
      // property.html always shows this one parcel, regardless of which
      // property card was clicked. Ashford/Isla Verde have real database
      // rows now too, but no detail page of their own yet, so their cards
      // stay non-navigable (href="#"), same as before this migration.
      const DEMO_PARCEL_ID = "a0000000-0000-4000-8000-000000000001";

      // ---------- live backend (Supabase): same pattern as the other
      // migrated pages. Falls back to the prototype mock data on failure.
      try {
        P.comparisonProperties = await window.AterraDB.allPropertiesSummary();
        console.info("ATERRA: property list is now live from Supabase.");
      } catch (err) {
        console.warn("ATERRA: sample database unreachable; using the bundled sample data.", err.message);
      }

      const selected = new Set(P.comparisonProperties.map((p) => p.id));

      function render() {
        list.innerHTML = P.comparisonProperties
          .map(
            (p) => `
          <div class="property-card${selected.has(p.id) ? " is-selected" : ""}" data-id="${p.id}">
            <button type="button" class="pcard-checkbox" data-toggle="${p.id}" aria-pressed="${selected.has(p.id)}" aria-label="${I.t("properties_selectFor").replace("{a}", p.address)}">
              <svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <a class="pcard-link" href="${p.id === DEMO_PARCEL_ID ? "property.html" : "compare.html"}">
              <div class="pcard-top" style="padding-right:26px;">
                <div>
                  <h3>${p.address}</h3>
                  <div class="pcard-muni">${p.municipality}, Puerto Rico</div>
                </div>
                <span class="status status-${p.status}">${I.t("common_status_" + p.status)}</span>
              </div>
              <div class="pcard-meta">
                <div class="field"><div class="m">${I.t("common_project")}</div><div class="v">${I.tv(p.projectType)}</div></div>
                <div class="field"><div class="m">${I.t("common_lastAnalyzed")}</div><div class="v">${p.lastAnalyzed}</div></div>
              </div>
            </a>
          </div>`
          )
          .join("");

        list.querySelectorAll("[data-toggle]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            const id = btn.dataset.toggle;
            if (selected.has(id)) selected.delete(id);
            else selected.add(id);
            render();
            list.querySelector(`[data-toggle="${CSS.escape(id)}"]`).focus();
          });
        });

        document.getElementById("selected-count").textContent = selected.size;
        document.getElementById("compare-btn").disabled = selected.size < 2;
      }

      function goToCompare() {
        sessionStorage.setItem("aterra-compare-ids", JSON.stringify([...selected]));
        window.location.href = "compare.html";
      }
      document.getElementById("compare-btn").addEventListener("click", goToCompare);
      document.getElementById("compare-quick-btn").addEventListener("click", goToCompare);

      render();
    })();
  </script>
</body>
</html>
