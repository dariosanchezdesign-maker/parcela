<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Properties — Parcela</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="shell">
    <aside class="shell-nav">
      <a href="landing.html" class="shell-brand">
        <span class="shell-brand-mark" aria-hidden="true"></span>
        Parcela
      </a>
      <ul class="shell-nav-list">
        <li><a href="overview.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="3" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="3" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/><rect x="11" y="11" width="6" height="6" rx="1" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="nav_overview">Overview</span><span class="nav-dot"></span></a></li>
        <li><a href="explore.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><path d="M3 6l5-2 4 2 5-2v10l-5 2-4-2-5 2V6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span data-i18n="nav_explore">Explore</span><span class="nav-dot"></span></a></li>
        <li><a href="properties.html" class="active"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><path d="M10 2l7 4v8l-7 4-7-4V6l7-4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg><span data-i18n="nav_properties">Properties</span><span class="nav-dot"></span></a></li>
        <li><a href="projects.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="12" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M3 8h14" stroke="currentColor" stroke-width="1.4"/></svg><span data-i18n="nav_projects">Projects</span><span class="nav-dot"></span></a></li>
        <li><a href="reports.html"><svg class="shell-nav-icon" viewBox="0 0 20 20" fill="none"><path d="M5 2h7l3 3v13H5V2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 10h4M8 13h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg><span data-i18n="nav_reports">Reports</span><span class="nav-dot"></span></a></li>
      </ul>
      <div class="shell-nav-footer"><span data-i18n="nav_footer">Prototype data · Puerto Rico</span><span id="lang-toggle-slot"></span></div>
    </aside>

    <div class="shell-main">
      <div class="shell-content">
        <div class="page-head">
          <div>
            <h1 data-i18n="properties_title">Properties</h1>
            <p data-i18n="properties_subtitle">Every property you've analyzed. Select two or more to compare.</p>
          </div>
          <div style="display:flex; gap:var(--sp-3); flex-wrap:wrap;">
            <button class="btn btn-ghost" id="compare-quick-btn" data-i18n="common_compareProperties">Compare properties</button>
            <a href="index.html" class="btn btn-primary" data-i18n="common_analyzeProperty">Analyze a property</a>
          </div>
        </div>

        <div class="property-grid" id="property-list"></div>

        <div class="compare-bar">
          <span class="cb-count"><strong id="selected-count">0</strong> <span data-i18n="properties_selected">selected</span></span>
          <button class="btn btn-primary" id="compare-btn" disabled data-i18n="common_compareProperties">Compare properties</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/data/mockData.js"></script>
  <script>
    (function () {
      const P = window.PARCELA;
      const I = window.ParcelaI18N;
      const list = document.getElementById("property-list");
      const selected = new Set(P.comparisonProperties.map((p) => p.id));

      function render() {
        list.innerHTML = P.comparisonProperties
          .map(
            (p) => `
          <div class="property-card${selected.has(p.id) ? " is-selected" : ""}" data-id="${p.id}">
            <button class="pcard-checkbox" data-toggle="${p.id}" aria-label="Select ${p.address} for comparison">
              <svg viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <a href="${p.id === P.property.id ? "property.html" : "#"}" style="text-decoration:none; color:inherit;">
              <div class="pcard-top" style="padding-right:26px;">
                <div>
                  <h3>${p.address}</h3>
                  <div class="pcard-muni">${p.municipality}, Puerto Rico</div>
                </div>
                <span class="status status-${p.status}">${I.t("common_status_" + p.status)}</span>
              </div>
              <div class="pcard-meta">
                <div class="field"><div class="m">${I.t("common_project")}</div><div class="v">${I.tv(p.projectType)}</div></div>
                <div class="field"><div class="m">${I.t("common_lastAnalyzed")}</div><div class="v">${p.lastAnalyzed}</div></div>
              </div>
            </a>
          </div>`
          )
          .join("");

        list.querySelectorAll("[data-toggle]").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            const id = btn.dataset.toggle;
            if (selected.has(id)) selected.delete(id);
            else selected.add(id);
            render();
          });
        });

        document.getElementById("selected-count").textContent = selected.size;
        document.getElementById("compare-btn").disabled = selected.size < 2;
      }

      function goToCompare() {
        sessionStorage.setItem("parcela-compare-ids", JSON.stringify([...selected]));
        window.location.href = "compare.html";
      }
      document.getElementById("compare-btn").addEventListener("click", goToCompare);
      document.getElementById("compare-quick-btn").addEventListener("click", goToCompare);

      render();
    })();
  </script>
</body>
</html>
